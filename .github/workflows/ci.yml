name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend scripts
      - run: ruff format --check backend scripts
      - run: pytest
      - name: Snapshot rebuild is reproducible
        run: |
          python scripts/build_snapshot.py --out /tmp/rebuilt.sqlite
          python scripts/coverage_report.py --snapshot /tmp/rebuilt.sqlite

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wind-forecast-replay:ci .
      - name: Smoke test the container
        run: |
          docker run -d --rm -p 8000:8000 --name smoke wind-forecast-replay:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fsS "http://127.0.0.1:8000/api/v1/forecast?decision_date=2026-01-10&cutoff=09:20" | head -c 300
          curl -fsS http://127.0.0.1:8000/ | grep -q "<div id=\"root\">"
          docker stop smoke
